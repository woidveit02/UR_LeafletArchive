{# The floating bar of the evidence picking (evidence-pick.js): names the field, counts the blocks, ends the picking. #}
<div class="pick-bar" role="status" hidden>
    <span>Beleg für <strong class="pick-field"></strong>: <span class="pick-n"></span></span>
    <button type="button" class="button small" data-pick="done">Fertig</button>
    <button type="button" class="button text" data-pick="cancel">Abbrechen</button>
</div>
