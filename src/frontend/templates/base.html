<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% set page_title %}{% block title %}{% endblock %}{% endset %}
    <title>{{ page_title ~ " – " if page_title }}Flugblattsammlung</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
</head>
<body>
    <a class="skip-link" href="#content">Zum Inhalt</a>
    {% include '_navigation.html' %}
    <main id="content" class="app{% block app_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='field-search.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
