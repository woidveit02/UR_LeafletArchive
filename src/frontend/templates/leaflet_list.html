<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>UR Leaflet Archive</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
</head>

<body>
    {% include '_navigation.html' %}
    <div class="app">
        <h1>Flugblätter</h1>
        <form method="get" action="/leaflets" class="filter">
            <label for="org">Herausgeber</label>
            <select name="org" id="org" onchange="this.form.submit()">
                <option value="">alle</option>
                {% for o in org_options %}
                <option value="{{ o.id }}" {% if o.id==selected_org %}selected{% endif %}>{{ o.label }}</option>
                {% endfor %}
            </select>
            <noscript><button type="submit">Filtern</button></noscript>
        </form>
        {% from '_leaflets.html' import leaflet_list %}
        {{ leaflet_list(leaflets, fields=('date', 'issuers', 'series', 'count')) }}
    </div>


</body>

</html>
