<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>UR Leaflet Archive</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>

<body>
	<div class="app">
        {% include '_navigation.html' %}
		<h1>Flugblatt-Liste:</h1>
        <ul id="leaflet-list">
            {% for leaflet in leaflets %}
            <li><a href="/leaflets/{{ leaflet.id }}">{{ leaflet.title if leaflet.title else '*kein Titel*' }}</a></li>
            {% else %}
            <li>Keine Flugblätter gefunden.</li>
            {% endfor %}
        </ul>
	</div>


</body>

</html>
