<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<title>Raumsuche</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="app">
        {% include '_navigation.html' %}
	    <h1>Raum suchen</h1>

	    <form method="get">
		    <div>
			    <label for="query">Raumname:</label>
			    <input type="text" id="query" name="query" value="{{ query | default('', true) }}">
		    </div>
		    <button type="submit">Suchen</button>
	    </form>

	    <ul id="room-list">
		    {% for room in rooms | default([], true) %}
		    <li>
			    <a href="/rooms/{{ room.id }}">{{ room.names[0] if room.names else 'Kein Name' }}</a>
		    </li>
		    {% else %}
		    <li>Keine Raeume gefunden.</li>
		    {% endfor %}
	    </ul>
    </div>
</body>
</html>
