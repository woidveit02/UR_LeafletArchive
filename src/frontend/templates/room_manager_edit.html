<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>woidveit02s RaumManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
	<div class="app">
        {% include '_navigation.html' %}
        {% set room_data = room_data or {} %}

		<h1>Raum bearbeiten:</h1>

        <form action="/admin/rooms/edit" method="post">

            <div>
                <label>Raum ID:</label>
                <input type="text" id="room_id" name="room_id" value="{{ room_data.get('id', '') }}" required>
            </div>
            <div>
                <label>Weitere IDs: (Liste)</label>
                <input type="text" id="secondary_ids" name="secondary_ids" value="{{ room_data.get('secondary_ids', '') }}">
            </div>
            <div>
                <label>Namen: (Liste)</label>
                <input type="text" id="names" name="names" value="{{ room_data.get('names', '') }}">
            </div>
            <div>
                <label>Kategorie:</label>
                <input type="text" id="category" name="category" value="{{ room_data.get('category', '') }}">
            </div>
            <div>
                <label>Kommentar:</label>
                <input type="text" id="comment" name="comment" value="{{ room_data.get('comment', '') }}">
            </div>
            <div>
                <label>Gebäude ID:</label>
                <input type="text" id="building_id" name="building_id" value="{{ room_data.get('building_id', '') }}">
            </div>
            <div>
                <label>Ebene:</label>
                <input type="text" id="level" name="level" value="{{ room_data.get('level', '') }}">
            </div>
            <div>
                <label>Koordinaten-Länge:</label>
                <input type="text" id="longitude" name="longitude" value="{{ room_data.get('longitude', '') }}">
            </div>
            <div>
                <label>Koordinaten-Breite:</label>
                <input type="text" id="latitude" name="latitude" value="{{ room_data.get('latitude', '') }}">
            </div>
            <div>
                <label>Anzahl Sitze:</label>
                <input type="text" id="seats_amount" name="seats_amount" value="{{ room_data.get('seats_amount', '') }}">
            </div>
            <div>
                <label>Arrangement Sitze:</label>
                <input type="text" id="seats_arrangement" name="seats_arrangement" value="{{ room_data.get('seats_arrangement', '') }}">
            </div>
            <div>
                <label>Anzahl Steckdosen:</label>
                <input type="text" id="outlet_amount" name="outlet_amount" value="{{ room_data.get('outlet_amount', '') }}">
            </div>
            <div>
                <label>Projektor:</label>
                <input type="text" id="projector" name="projector" value="{{ room_data.get('projector', '') }}">
            </div>
            <div>
                <label>Projektor Auflösung:</label>
                <input type="text" id="projector_resolution" name="projector_resolution" value="{{ room_data.get('projector_resolution', '') }}">
            </div>
            <div>
                <label>Beleuchtung:</label>
                <input type="text" id="lighting" name="lighting" value="{{ room_data.get('lighting', '') }}">
            </div>
            <div>
                <label>Foto 1 ID:</label>
                <input type="text" id="foto1" name="foto1" value="{{ room_data.get('foto1', '') }}">
            </div>
            <div>
                <label>Foto 2 ID:</label>
                <input type="text" id="foto2" name="foto2" value="{{ room_data.get('foto2', '') }}">
            </div>
            <div>
                <label>Foto 1 Info:</label>
                <input type="text" id="foto1_info" name="foto1_info" value="{{ room_data.get('foto1_info', '') }}">
            </div>
            <div>
                <label>Foto 2 Info:</label>
                <input type="text" id="foto2_info" name="foto2_info" value="{{ room_data.get('foto2_info', '') }}">
            </div>
            <div>
                <label>PDF ID:</label>
                <input type="text" id="pdf" name="pdf" value="{{ room_data.get('pdf', '') }}">
            </div>

            <button type="submit">Raum bearbeiten</button>
        </form>

	    {% if error %}
	    <p>{{ error }}</p>
	    {% endif %}

	    {% if success %}
	    <p>{{ success }}</p>
	    {% endif %}
	</div>


</body>

</html>
