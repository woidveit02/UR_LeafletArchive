<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>woidveit02s RaumManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
	<div class="app">
        {% include '_navigation.html' %}
        
		<h1>Raum entfernen:</h1>

        <form action="/admin/rooms/delete" method="post">

            <div>
                <label>Raum ID:</label>
                <input type="text" id="room_id" name="room_id" required>
            </div>

            <button type="submit">Raum entfernen</button>
        </form>

        {% if error %}
        <p>{{ error }}</p>
        {% endif %}

        {% if success %}
        <p>{{ success }}</p>
        {% endif %}

	</div>

</body>

</html>
