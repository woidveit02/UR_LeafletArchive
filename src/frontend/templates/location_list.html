<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>woidveit02s RaumManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
	<div class="app">
        {% include '_navigation.html' %}
		<h1>Standortliste:</h1>
        <ul id="location-list">
            {% for location in locations %}
            <li><a href="/locations/{{ location.id }}">{{ location.name if location.name else '*kein Name*' }}</a></li>
            {% else %}
            <li>Keine Standorte gefunden.</li>
            {% endfor %}
        </ul>
	</div>


</body>

</html>
