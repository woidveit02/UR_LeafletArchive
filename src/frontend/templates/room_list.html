<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>woidveit02s RaumManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
	<div class="app">
        {% include '_navigation.html' %}
		<h1>Raumliste:</h1>
        <ul id="room-list">
            {% for room in rooms %}
            <li><a href="/rooms/{{ room.id }}">{{ room.names[0] if room.names else '*kein Name*' }}</a></li>
            {% else %}
            <li>Keine Räume gefunden.</li>
            {% endfor %}
        </ul>
	</div>


</body>

</html>
