services:
  backend:
    platform: linux/amd64  # hdbscan has no ARM build; Macs with Apple chips run the image emulated
    build:
      context: ./src/backend
      additional_contexts:
        repo: .  # docs/ and mkdocs.yml for the documentation in the image
    restart: unless-stopped
    ports:
      - "${LEAFLET_BIND:-127.0.0.1}:8000:8000"  # local only; server setup in docs/handbuch/installieren-und-betreiben.md
    environment:
      - TZ=Europe/Berlin  # stamps of OCR runs, metadata and corrections in local time
      - LEAFLET_DATA_DIR=/app/data
      - LEAFLET_PDF_DIR=/data/pdfs
      - LEAFLET_PDF_HOST_DIR=${LEAFLET_PDF_HOST_DIR:-../UR_LeafletArchive_data}
      - LEAFLET_CORRECTIONS=${LEAFLET_CORRECTIONS:-}  # other file, e.g. for UI tests
      - DATALAB_API_KEY=${DATALAB_API_KEY:-}  # only the import of new volumes needs these (.env)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - ./src/backend:/app
      - ./src/frontend/templates:/app/app/templates
      - ./src/frontend/static:/app/app/static
      - ./data:/app/data
      - ./data/photos:/app/app/static/photos
      - ${LEAFLET_PDF_HOST_DIR:-../UR_LeafletArchive_data}:/data/pdfs  # by default next to the repository